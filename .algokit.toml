[project]
type = 'contract'
name = 'algorand-ai-contract-creator'
artifacts = 'smart_contracts/artifacts'

[project.run]
# Run the AI web interface
web = 'python main.py'

# Run tests
test = 'pytest tests/ -v'

[project.deploy]
# Deployment configuration
# Note: Deployment is handled through the Streamlit UI
# Use the "Deploy" tab in the web interface
network = 'testnet'

[generate]
# Where AI-generated contracts are saved
output_path = 'outputs/contracts'
ai_provider = 'perplexity'  # or 'openai'
default_model = 'llama-3.1-sonar-large-128k-online'

[ai]
# AI configuration
temperature = 0.2
max_retries = 3
